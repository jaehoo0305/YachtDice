<!DOCTYPE html>
<html lang="ko">

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yacht Dice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='GameStyle.css') }}">
    <style>

    </style>
</head>

<body class="mainBox-ingame">
    <div class="subbox">
        <div class="scorecard">

            <div class="score-row header-row">
                <div class="cell turn-cell">
                    <span class="turn-label">Turn</span>
                    <span class="turn-value">1/12</span>
                </div>

                <div class="cell player-header">
                    플레이어 1
                </div>

                <div class="cell player-header">
                    플레이어 2
                </div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">⚀ Aces</div>
                <div class="cell input-cell" data-score-type="aces" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="aces" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">⚁ Deuces</div>
                <div class="cell input-cell" data-score-type="deuces" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="deuces" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">⚂ Threes</div>
                <div class="cell input-cell" data-score-type="threes" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="threes" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">⚃ Fours</div>
                <div class="cell input-cell" data-score-type="fours" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="fours" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">⚄ Fives</div>
                <div class="cell input-cell" data-score-type="fives" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="fives" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">⚅ Sixes</div>
                <div class="cell input-cell" data-score-type="sixes" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="sixes" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">Subtotal</div>
                <div class="cell score-val">0/63</div>
                <div class="cell score-val">0/63</div>
            </div>

            <div class="score-row bonus-row">
                <div class="cell label-cell">+35 Bonus</div>
                <div class="cell input-cell"></div>
                <div class="cell input-cell"></div>
            </div>

            <div class="score-row gap-row">
                <div class="cell label-cell">Choice</div>
                <div class="cell input-cell" data-score-type="choice" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="choice" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">4 of a kind</div>
                <div class="cell input-cell" data-score-type="4_of_a_kind" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="4_of_a_kind" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">Full House</div>
                <div class="cell input-cell" data-score-type="full_house" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="full_house" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">S. Straight</div>
                <div class="cell input-cell" data-score-type="small_straight" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="small_straight" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">L. Straight</div>
                <div class="cell input-cell" data-score-type="large_straight" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="large_straight" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row">
                <div class="cell label-cell">Yacht</div>
                <div class="cell input-cell" data-score-type="yacht" onclick="selectScore(this)"></div>
                <div class="cell input-cell" data-score-type="yacht" onclick="selectScore(this)"></div>
            </div>

            <div class="score-row total-row">
                <div class="cell label-cell total-label">
                    Total
                </div>

                <div class="cell score-val">
                    <span class="box-score">0</span>
                </div>

                <div class="cell score-val">
                    <span class="box-score">0</span>
                </div>
            </div>

        </div>

        <div class="game-area">
            <div class="title-box">
                <h1>Yacht Dice</h1>
                <button type="button" class="roll-button" onclick="rollDice()">
                    주사위 굴리기
                </button>
            </div>
            <div class="dice-area">
                <div class="dice-row">
                    <button type="button" class="hole-button" onclick="hold(1, this)">
                        홀드
                    </button>
                    <h3>
                        주사위 결과 1:
                        <span id="dice-result1" class="dice-value">0</span>
                    </h3>
                </div>
                <div class="dice-row">
                    <button type="button" class="hole-button" onclick="hold(2, this)">
                        홀드
                    </button>
                    <h3>
                        주사위 결과 2:
                        <span id="dice-result2" class="dice-value">0</span>
                    </h3>
                </div>
                <div class="dice-row">
                    <button type="button" class="hole-button" onclick="hold(3, this)">
                        홀드
                    </button>
                    <h3>
                        주사위 결과 3:
                        <span id="dice-result3" class="dice-value">0</span>
                    </h3>
                </div>
                <div class="dice-row">
                    <button type="button" class="hole-button" onclick="hold(4, this)">
                        홀드
                    </button>
                    <h3>
                        주사위 결과 4:
                        <span id="dice-result4" class="dice-value">0</span>
                    </h3>
                </div>
                <div class="dice-row">
                    <button type="button" class="hole-button" onclick="hold(5, this)">
                        홀드
                    </button>
                    <h3>
                        주사위 결과 5:
                        <span id="dice-result5" class="dice-value">0</span>
                    </h3>
                </div>
            </div>
        </div>
    </div>


    <script>
        let holdStatus = [false, false, false, false, false];
        let currentScores = null;
        let isRolled = false;

        function hold(diceIndex, button) {
            const index = diceIndex - 1;
            holdStatus[index] = !holdStatus[index];
            button.classList.toggle("active", holdStatus[index]);
        }

        async function rollDice() {
            const dicelist = [];

            for (let i = 1; i <= 5; i++) {
                const element = document.getElementById(`dice-result${i}`);
                dicelist.push({
                    val: Number(element.innerText),
                    hold: holdStatus[i - 1]
                });
            }

            try {
                const response = await fetch('/api/roll', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ dicelist: dicelist })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || '로그인이 필요하거나 요청에 실패했습니다.');
                }

                const data = await response.json();

                for (let i = 0; i < 5; i++) {
                    document.getElementById(`dice-result${i + 1}`).innerText = data.dicelist[i].val;
                }

                currentScores = data.scores;
                isRolled = true;
                updateScorePreview();

            } catch (error) {
                console.error("주사위 굴리기 실패:", error);
                alert(error.message || "서버와 연결할 수 없습니다.");
            }
        }

        function updateScorePreview() {
            if (!currentScores) return;

            const inputCells = document.querySelectorAll('.input-cell');
            inputCells.forEach(cell => {
                if (cell.classList.contains('fixed')) return;

                const scoreType = cell.getAttribute('data-score-type');
                if (scoreType && currentScores[scoreType] !== undefined) {
                    cell.innerText = currentScores[scoreType];
                    cell.style.color = '#999';
                }
            });
        }

        function selectScore(cell) {
            if (!isRolled || cell.classList.contains('fixed')) return;

            const scoreType = cell.getAttribute('data-score-type');
            if (!scoreType || currentScores[scoreType] === undefined) return;

            cell.innerText = currentScores[scoreType];
            cell.style.color = '#000';
            cell.classList.add('fixed');

            const inputCells = document.querySelectorAll('.input-cell');
            inputCells.forEach(c => {
                if (!c.classList.contains('fixed')) {
                    c.innerText = '';
                }
            });

            isRolled = false;
            currentScores = null;
            holdStatus = [false, false, false, false, false];

            document.querySelectorAll('.hole-button').forEach(btn => {
                btn.classList.remove('active');
            });
        }
    </script>
</body>

</html>
